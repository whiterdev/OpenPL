[package]
name = "openpl-core"
description = "Lógica de OpenPL: perfiles, catálogo y sesiones (sin interfaz)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
testing = []

[dependencies]
openpl-oracle = { path = "../openpl-oracle" }
serde = { workspace = true }
oracle = "0.6"
serde_json = "1"
thiserror = "2"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
